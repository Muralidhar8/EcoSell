{% extends "base.html" %}

{% block title %}403 - Forbidden Access | EcoSell{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="p-5 bg-white rounded-4 shadow-sm border">
                <i class="bi bi-shield-lock text-danger display-1 mb-3 d-block"></i>
                <h2 class="fw-bold text-dark mb-2">Access Forbidden (403)</h2>
                <p class="text-muted mb-4">You do not have permission to view this resource. Please make sure you are signed in with the correct role (Seller, Buyer, or Admin).</p>
                <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">Return Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
